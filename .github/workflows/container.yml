name: Container

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/container.yml"
      - "Dockerfile"
      - "container/constraints.txt"
      - "scripts/smoke_container.py"
      - "tests/unit/test_container_distribution.py"
      - "tests/unit/test_smoke_container.py"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    name: Build and smoke native image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and smoke application image
        run: |
          python scripts/smoke_container.py \
            --image histdatacom:ci-smoke \
            --version "${GITHUB_REF_NAME}" \
            --revision "${GITHUB_SHA}"
        shell: bash

  publish:
    name: Publish multi-platform image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Resolve build timestamp
        id: build
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Build and publish image
        uses: docker/build-push-action@v7.3.0
        with:
          build-args: |
            IMAGE_CREATED=${{ steps.build.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
