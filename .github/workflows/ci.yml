name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Download actionlint
        run: |
          bash <(curl --fail --location --show-error https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      - name: Check workflow files
        run: |
          ./actionlint -color
          ./actionlint -color broker-plugins/reference/.github/workflows/ci.yml broker-plugins/starter/.github/workflows/ci.yml
        shell: bash

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install -e ".[docs]"

      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts samples test.py snippets.py

      - name: Smoke editable install metadata
        run: |
          python - <<'PY'
          from importlib import metadata

          import histdatacom

          dist = metadata.distribution("histdatacom")
          scripts = {
              entry.name: entry.value
              for entry in metadata.entry_points().select(group="console_scripts")
          }

          assert dist.metadata["Name"] == "histdatacom"
          assert metadata.version("histdatacom") == histdatacom.__version__
          assert scripts["histdatacom"] == "histdatacom.histdata_com:main"
          assert (
              scripts["histdatacom-orchestration-worker"]
              == "histdatacom.orchestration.worker:main"
          )
          assert "histdatacom-orchestration" not in scripts
          PY
        shell: bash

  production-coverage:
    name: Production coverage
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install -e ".[test]"

      - name: Run production coverage
        run: python -m pytest --cov=histdatacom --cov-report=term-missing:skip-covered --cov-report=json:coverage.json --cov-report=xml --cov-report=html

      - name: Enforce coverage threshold
        run: python -m coverage report

      - name: Enforce critical-module branch floors
        run: |
          python scripts/critical_path_quality.py coverage \
            --coverage-json coverage.json \
            --output critical-branch-coverage.json

      - name: Run critical property invariants
        run: |
          python scripts/critical_path_quality.py properties \
            --output critical-property-invariants.json

      - name: Run focused critical mutations
        run: |
          python scripts/critical_path_quality.py mutations \
            --profile focused \
            --output critical-mutation-testing.json

      - name: Upload production coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-coverage
          path: |
            coverage.xml
            coverage.json
            htmlcov/
            critical-branch-coverage.json
            critical-property-invariants.json
            critical-mutation-testing.json
          if-no-files-found: warn

  release-mutations:
    name: Release mutation report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install -e ".[test]"

      - name: Run bounded release mutation set
        run: |
          python scripts/critical_path_quality.py mutations \
            --profile release \
            --output critical-mutation-testing-release.json

      - name: Upload release mutation report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: critical-mutation-testing-release
          path: critical-mutation-testing-release.json
          if-no-files-found: warn

  build:
    name: Build package artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install -e ".[release]"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package artifacts
        run: python -m twine check dist/*

      - name: Inspect wheel metadata
        run: python scripts/inspect_wheel.py --report dist/runtime-wheel-report.json

      - name: Smoke wheel install
        run: |
          python -m venv .wheel-smoke
          . .wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python scripts/smoke_runtime_install.py --wheel-dir dist --state-dir .runtime-smoke
        shell: bash

      - name: Smoke wheel temporal compatibility extra install
        run: |
          python -m venv .wheel-temporal-smoke
          . .wheel-temporal-smoke/bin/activate
          python -m pip install --upgrade pip
          python scripts/smoke_runtime_install.py \
            --wheel-dir dist \
            --state-dir .runtime-temporal-smoke \
            --expect-temporal-extra \
            --skip-cli
        shell: bash

      - name: Smoke wheel extras install
        run: |
          python -m venv .wheel-extras-smoke
          . .wheel-extras-smoke/bin/activate
          python -m pip install --upgrade pip
          wheel="$(ls dist/*.whl)"
          python -m pip install "${wheel}[all]"
          python - <<'PY'
          from importlib import metadata
          import importlib.util

          for distribution_name in (
              "influxdb-client",
              "ipywidgets",
              "jupyter",
              "pandas",
              "pyarrow",
              "statsmodels",
              "arch",
              "temporalio",
          ):
              metadata.version(distribution_name)

          for module_name in (
              "influxdb_client",
              "ipywidgets",
              "pandas",
              "pyarrow",
              "statsmodels",
              "arch",
              "temporalio",
          ):
              if importlib.util.find_spec(module_name) is None:
                  raise SystemExit(f"missing expected optional module {module_name}")
          PY
        shell: bash

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: histdatacom-dist
          path: dist/*
          if-no-files-found: error

  standalone-brokers:
    name: Installed ${{ matrix.project }} broker on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [reference, starter]
        python-version: ['3.10', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Prepare separate project and noneditable environment
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          mkdir "$RUNNER_TEMP/broker-qualification"
          cp -R "broker-plugins/$PROJECT" "$RUNNER_TEMP/broker-project"
          echo "QUALIFICATION_DIR=$RUNNER_TEMP/broker-qualification" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$RUNNER_TEMP/broker-project" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/broker-venv"
          echo "$RUNNER_TEMP/broker-venv/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Download this run's actual host build
        uses: actions/download-artifact@v8.0.1
        with:
          name: histdatacom-dist
          path: ${{ env.QUALIFICATION_DIR }}/host-dist

      - name: Install the exact host wheel and project build tools
        working-directory: ${{ env.QUALIFICATION_DIR }}
        run: |
          host_wheels=(host-dist/histdatacom-*.whl)
          test "${#host_wheels[@]}" -eq 1
          sha256sum "${host_wheels[0]}" > host-wheel.sha256
          python -m pip install --upgrade 'pip==25.1.1'
          python -m pip install "${host_wheels[0]}" build 'black==26.5.1' 'ruff==0.15.18'
        shell: bash

      - name: Check source metadata and pinned project style without rewriting
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          python tools/check_host.py | tee "$QUALIFICATION_DIR/host-api.json"
          python tools/generate_metadata.py --check
          python -m black --check --line-length 88 --target-version py310 .
          python -m ruff check --config pyproject.toml .
        shell: bash

      - name: Build ordinary sdist then wheel and install the actual plugin
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          python -m build --outdir "$QUALIFICATION_DIR/plugin-dist"
          plugin_wheels=("$QUALIFICATION_DIR"/plugin-dist/*.whl)
          test "${#plugin_wheels[@]}" -eq 1
          sha256sum "$QUALIFICATION_DIR"/plugin-dist/* > "$QUALIFICATION_DIR/plugin-artifacts.sha256"
          python -m pip install "${plugin_wheels[0]}[test]"
          python -m pip check | tee "$QUALIFICATION_DIR/dependencies.txt"
          python -m pip freeze > "$QUALIFICATION_DIR/installed.txt"
        shell: bash

      - name: Retain exact installed archive identities and unpack the tested sdist
        working-directory: ${{ env.QUALIFICATION_DIR }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          python -I -B - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path, PurePosixPath
          import sysconfig
          import tarfile
          from zipfile import ZipFile

          root = Path.cwd()
          plugin = ('histdatacom-reference-broker' if os.environ['PROJECT'] == 'reference'
                    else 'histdatacom-broker-starter')
          identities = {}
          for name, directory in (('histdatacom', 'host-dist'), (plugin, 'plugin-dist')):
              wheels = tuple((root / directory).glob('*.whl'))
              assert len(wheels) == 1
              sha256 = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
              distribution = importlib.metadata.distribution(name)
              direct = json.loads(distribution.read_text('direct_url.json'))
              assert direct.get('archive_info', {}).get('hashes', {}).get('sha256') == sha256
              assert not direct.get('dir_info', {}).get('editable', False)
              compared = 0
              with ZipFile(wheels[0]) as archive:
                  for member in archive.namelist():
                      if member.endswith('/'):
                          continue
                      parts = PurePosixPath(member).parts
                      assert not member.startswith('/') and '..' not in parts
                      # pip rewrites RECORD and adds launchers/direct_url.json;
                      # compare wheel payload, not the post-install RECORD bytes.
                      if len(parts) == 2 and parts[0].endswith('.dist-info') and parts[1] == 'RECORD':
                          continue
                      if parts[0].endswith('.data'):
                          # These projects have no rewritten wheel scripts. Fail
                          # closed on any future unsupported installation scheme.
                          assert len(parts) > 2 and parts[1] in ('purelib', 'platlib')
                          installed = Path(sysconfig.get_path(parts[1])).joinpath(*parts[2:])
                      else:
                          installed = Path(distribution.locate_file(member))
                      assert installed.read_bytes() == archive.read(member), member
                      compared += 1
              assert compared > 0
              identities[name] = {'version': distribution.version, 'wheel_sha256': sha256,
                                  'installed_wheel_members_equal': compared}
          (root / 'installed-identities.json').write_text(json.dumps(identities, sort_keys=True))
          sdists = tuple((root / 'plugin-dist').glob('*.tar.gz'))
          assert len(sdists) == 1
          extracted = root / 'sdist-source'
          extracted.mkdir()
          with tarfile.open(sdists[0]) as archive:
              archive.extractall(extracted, filter='data')
          projects = tuple(extracted.iterdir())
          assert len(projects) == 1 and projects[0].is_dir()
          source = Path(os.environ['SOURCE_DIR'])
          def test_inventory(project):
              return {str(path.relative_to(project)): hashlib.sha256(path.read_bytes()).hexdigest()
                      for path in (project / 'tests').rglob('*') if path.is_file()}
          assert test_inventory(source) == test_inventory(projects[0])
          for relative in ('pyproject.toml', 'tools/check_host.py', 'tools/generate_metadata.py',
                           'conformance/driver.json', 'DEVELOPER_GUIDE.md', 'OPERATOR.md',
                           '.github/workflows/ci.yml'):
              assert (source / relative).read_bytes() == (projects[0] / relative).read_bytes()
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('TEST_PROJECT=' + str(projects[0]) + '\n')
          PY
        shell: bash

      - name: Run every project test against the installed wheel
        working-directory: ${{ env.QUALIFICATION_DIR }}
        run: |
          python -I -B -m pytest -q -p no:cacheprovider -c "$TEST_PROJECT/pyproject.toml" "$TEST_PROJECT/tests" --basetemp="$QUALIFICATION_DIR/pytest-temp" --junitxml="$QUALIFICATION_DIR/project-tests.xml"
        shell: bash

      - name: Discover the installed candidate and plan all trusted capabilities
        working-directory: ${{ env.QUALIFICATION_DIR }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          plugin_id=org.example.starter
          capabilities=(quotes.v1 timestamps.broker-event.v1 timestamps.receive.v1 heartbeat.v1 gaps.v1)
          if [[ "$PROJECT" == reference ]]; then
            plugin_id=org.histdatacom.reference-broker
            capabilities+=(sizes.quoted.v1 raw-hashes.v1)
          fi
          python -I -B -m histdatacom.broker_plugin_registry inspect --plugin-id "$plugin_id" --json > discovery.json
          args=()
          for capability in "${capabilities[@]}"; do args+=(--capability "$capability"); done
          python -I -B -m histdatacom.broker_plugin_conformance plan --driver "$TEST_PROJECT/conformance/driver.json" --profile trusted_contract_v1 "${args[@]}" --output plan.json
          python -I -B - <<'PY'
          import os
          from pathlib import Path
          from histdatacom.broker_plugin_conformance import BrokerConformancePlanV1

          plan = BrokerConformancePlanV1.from_json(Path('plan.json').read_text())
          assert plan.catalog_id == 'broker-conformance-catalog:sha256:7c4965dad269a282167e08b1b04a7caaa6feaf4fc78da4d87b6229aef008b705'
          assert plan.subject.value == 'installed_candidate'
          assert len(plan.case_ids) == (28 if os.environ['PROJECT'] == 'reference' else 24)
          PY
        shell: bash

      # This generated-only trusted profile cannot certify native isolation or
      # native-only health. Full supported-kernel/operator gates stay separate.
      - name: Execute and independently verify the complete trusted plan
        working-directory: ${{ env.QUALIFICATION_DIR }}
        run: |
          python -I -B -m histdatacom.broker_plugin_conformance run --plan plan.json --output generated-run --authorize-generated-execution > run-report.json
          python -I -B -m histdatacom.broker_plugin_conformance verify generated-run > verify-report.json
          cmp run-report.json verify-report.json
        shell: bash

      - name: Retain qualification artifacts even when a gate fails
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: broker-${{ matrix.project }}-py${{ matrix.python-version }}
          path: ${{ env.QUALIFICATION_DIR }}/
          if-no-files-found: warn

  wheel-smoke:
    name: Smoke wheel on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Download package artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: histdatacom-dist
          path: dist

      - name: Smoke runtime package install
        run: python scripts/smoke_runtime_install.py --wheel-dir dist --state-dir .runtime-smoke
