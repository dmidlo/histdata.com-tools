[mypy]
files = src
exclude = (venv|build|snippets.py)
follow_imports = skip
ignore_missing_imports = True
no_site_packages = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
warn_return_any = True
warn_unreachable = True

allow_untyped_globals = True

# Forecast contracts share typed canonicalization and scoring helpers. Follow
# this scoped public package even when pre-commit passes only changed files;
# otherwise unchanged helpers become Any and invalidate partial-file checks.
[mypy-histdatacom.forecasting.*]
follow_imports = normal

# Triangle feature consumers retain typed bars, events and reconstruction
# clocks. Preserve those contracts when hooks check only changed files too.
[mypy-histdatacom.synthetic.*]
follow_imports = normal

# Training factories inherit the canonical typed decoder. Preserve its generic
# return types when hooks pass only changed consumers, rather than erasing the
# unchanged contract base to Any. This is not a package-wide PEP 561 claim.
[mypy-histdatacom.data_quality.training_contracts]
follow_imports = normal

# Diagnostic consumers also reuse the unchanged no-follow byte reader and
# frozen weighting scalar readers. Keep those return types when only changed
# consumers are checked at commit time, as in the all-source qualification.
[mypy-histdatacom.data_quality.training_lineage]
follow_imports = normal

[mypy-histdatacom.data_quality.training_weight_contracts]
follow_imports = normal

# Public metadata queries share strict local contracts and graph helpers.
# Keep those types when a later commit changes only one registry module.
[mypy-histdatacom.schema_compatibility.*]
follow_imports = normal

# Semantic proofs compose native profiles through a typed local boundary.
[mypy-histdatacom.schema_semantics.*]
follow_imports = normal

# Public experiment contracts share typed graph and persistence helpers.
# Preserve their types in both all-source and partial-file hook checks.
[mypy-histdatacom.experiments.*]
follow_imports = normal

# Temporal adapters replay through typed contracts and source helpers even
# when a scoped hook checks only an artifact reader or view.
[mypy-histdatacom.data_quality.training_temporal_contracts]
follow_imports = normal

[mypy-histdatacom.data_quality.training_temporal_sources]
follow_imports = normal

[mypy-histdatacom.data_quality.training_temporal_views]
follow_imports = normal

[mypy-histdatacom.data_quality.training_temporal_artifacts]
follow_imports = normal

# Causal joins retain typed source adapters during partial-file hook checks.
[mypy-histdatacom.data_quality.training_join_contracts]
follow_imports = normal

[mypy-histdatacom.data_quality.training_join_sources]
follow_imports = normal

[mypy-histdatacom.data_quality.training_join_market]
follow_imports = normal

[mypy-histdatacom.data_quality.training_join_context]
follow_imports = normal

[mypy-histdatacom.data_quality.training_join_views]
follow_imports = normal

[mypy-histdatacom.data_quality.training_join_artifacts]
follow_imports = normal
