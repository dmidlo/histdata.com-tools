[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histdatacom"
dynamic = ["version"]
description = "A command-line utility and Python ETL package that downloads currency exchange rates from Histdata.com with a default Temporal orchestration runtime and optional InfluxDB/Jupyter integrations."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10.0"
license = "MIT"
authors = [
    { name = "David Midlo", email = "dmidlo@gmail.com" },
]
keywords = [
    "finance",
    "data",
    "datascience",
    "HistData.com",
    "scraper",
    "influxdb",
    "currency exchange",
    "forex",
    "fx",
    "etl",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter",
    "Topic :: Terminals",
]
dependencies = [
    "certifi>=2026.6.17",
    "polars>=1.41.2",
    "pytz>=2026.2",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "Rx>=3.2",
    "temporalio>=1.10,<1.32",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
arrow = [
    "pyarrow>=24.0.0",
]
query = [
    "duckdb>=1.5.4,<2",
]
influx = [
    "influxdb-client>=1.50.0",
]
pandas = [
    "pandas>=2.3.3",
]
jupyter = [
    "jupyter",
    "ipywidgets",
]
temporal = [
    "temporalio>=1.10,<1.32",
]
models = [
    "arch>=8.0.0,<9",
    "statsmodels>=0.14.6,<0.15",
]
viz = [
    "matplotlib>=3.10.9,<3.11; python_version < '3.11'",
    "matplotlib>=3.11.1,<4; python_version >= '3.11'",
]
docs = [
    "myst-parser==4.0.1",
    "sphinx==8.1.3",
    "sphinx-rtd-theme==3.1.0",
]
all = [
    "arch>=8.0.0,<9",
    "duckdb>=1.5.4,<2",
    "influxdb-client>=1.50.0",
    "ipywidgets",
    "jupyter",
    "matplotlib>=3.10.9,<3.11; python_version < '3.11'",
    "matplotlib>=3.11.1,<4; python_version >= '3.11'",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "statsmodels>=0.14.6,<0.15",
    "temporalio>=1.10,<1.32",
]
test = [
    "arch==8.0.0",
    "coverage==7.15.4",
    "duckdb==1.5.5",
    "hypothesis==6.165.7",
    "ipykernel",
    "influxdb-client>=1.50.0",
    "nbclient",
    "nbformat",
    "matplotlib==3.10.9; python_version < '3.11'",
    "matplotlib==3.11.1; python_version >= '3.11'",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "statsmodels==0.14.6",
    "temporalio>=1.10,<1.32",
]
lint = [
    "black==26.5.1",
    "commitizen==4.17.0",
    "mypy==2.3.0",
    "pandas-stubs==3.0.3.260530; python_version >= '3.11'",
    "pre-commit==4.6.2",
    "pylint==4.0.6; python_version < '3.15'",
    "pyroma==5.0.1",
    "ruff==0.16.3",
    "sh==2.4.0",
    "shellcheck-py==0.11.0.1",
    "types-PyYAML==6.0.12.20260724",
]
release = [
    "build==1.5.0",
    "keyring==25.7.0",
    "setuptools==84.0.0",
    "twine==7.0.0",
    "wheel==0.48.0",
]
dev = [
    "arch==8.0.0",
    "build==1.5.0",
    "black==26.5.1",
    "commitizen==4.17.0",
    "coverage==7.15.4",
    "duckdb==1.5.5",
    "hypothesis==6.165.7",
    "ipykernel",
    "influxdb-client>=1.50.0",
    "ipywidgets",
    "jupyter",
    "keyring==25.7.0",
    "matplotlib==3.10.9; python_version < '3.11'",
    "matplotlib==3.11.1; python_version >= '3.11'",
    "myst-parser==4.0.1",
    "mypy==2.3.0",
    "nbclient",
    "nbformat",
    "pandas>=2.3.3",
    "pandas-stubs==3.0.3.260530; python_version >= '3.11'",
    "pre-commit==4.6.2",
    "pylint==4.0.6; python_version < '3.15'",
    "pyroma==5.0.1",
    "pyarrow>=24.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
    "setuptools==84.0.0",
    "sh==2.4.0",
    "shellcheck-py==0.11.0.1",
    "sphinx==8.1.3",
    "sphinx-rtd-theme==3.1.0",
    "statsmodels==0.14.6",
    "temporalio>=1.10,<1.32",
    "twine==7.0.0",
    "types-PyYAML==6.0.12.20260724",
    "wheel==0.48.0",
]

[project.urls]
Homepage = "https://github.com/dmidlo/histdata.com-tools"
"Bug Tracker" = "https://github.com/dmidlo/histdata.com-tools/issues"

[project.scripts]
histdatacom = "histdatacom.histdata_com:main"
histdatacom-orchestration-worker = "histdatacom.orchestration.worker:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"histdatacom.orchestration" = [
    "assets/README.md",
    "assets/*.json",
    "assets/bin/*/*",
    "assets/third-party/*/*",
]
"histdatacom.market_context" = [
    "assets/*.json",
]
"histdatacom.synthetic" = [
    "assets/*.json",
]

[tool.setuptools.dynamic]
version = { attr = "histdatacom.__version__" }
